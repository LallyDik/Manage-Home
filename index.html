<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול הכנסות והוצאות</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ניהול הכנסות והוצאות חודשי</h1>
            <div class="month-selector">
                <button id="prevMonth" class="nav-btn">◄</button>
                <h2 id="currentMonth"></h2>
                <button id="nextMonth" class="nav-btn">►</button>
            </div>
        </header>

        <div class="content">
            <!-- סעיף הכנסות -->
            <section class="section income-section">
                <div class="section-header">
                    <h3>הכנסות</h3>
                    <button id="addIncomeBtn" class="add-btn">+ הוסף הכנסה</button>
                </div>

                <div id="incomeList" class="items-list"></div>

                <div class="total">
                    <strong>סה"כ הכנסות:</strong>
                    <span id="totalIncome" class="amount">₪0</span>
                </div>
            </section>

            <!-- סעיף הוצאות -->
            <section class="section expense-section">
                <div class="section-header">
                    <h3>הוצאות</h3>
                    <button id="addExpenseBtn" class="add-btn">+ הוסף הוצאה</button>
                </div>

                <div id="expenseList" class="items-list"></div>

                <div class="total">
                    <strong>סה"כ הוצאות:</strong>
                    <span id="totalExpense" class="amount expense-amount">₪0</span>
                </div>
            </section>

            <!-- סיכום -->
            <section class="summary">
                <div class="summary-item">
                    <span>יתרה:</span>
                    <span id="balance" class="amount balance-amount">₪0</span>
                </div>
            </section>
        </div>
    </div>

    <!-- Modal להוספת הכנסה/הוצאה -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3 id="modalTitle"></h3>
            <form id="itemForm">
                <div class="form-group">
                    <label for="itemName">שם:</label>
                    <input type="text" id="itemName" required>
                </div>

                <div class="form-group">
                    <label for="itemAmount">סכום (₪):</label>
                    <input type="number" id="itemAmount" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="itemType">סוג:</label>
                    <select id="itemType" required>
                        <option value="one-time">חד פעמי</option>
                        <option value="recurring-fixed">קבוע - סכום קבוע</option>
                        <option value="recurring-variable">קבוע - סכום משתנה</option>
                    </select>
                </div>

                <div class="form-group" id="monthSelectGroup">
                    <label for="itemMonth">חודש:</label>
                    <input type="month" id="itemMonth">
                </div>

                <div class="form-group" id="hasSubItemsGroup" style="display: none;">
                    <label>
                        <input type="checkbox" id="hasSubItems">
                        פריט עם תתי-פריטים (לדוגמה: השכרת דירות)
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="submit-btn">שמור</button>
                    <button type="button" class="cancel-btn" id="cancelBtn">ביטול</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal לניהול תתי-פריטים -->
    <div id="subItemsModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="budgetManager.closeSubItemsModal()">&times;</span>
            <h3 id="subItemsModalTitle">ניהול תתי-פריטים</h3>

            <div id="subItemsList" class="sub-items-list"></div>

            <div class="add-sub-item-form">
                <h4>הוסף תת-פריט</h4>
                <div class="form-group">
                    <label for="subItemName">שם:</label>
                    <input type="text" id="subItemName">
                </div>
                <div class="form-group">
                    <label for="subItemAmount">סכום (₪):</label>
                    <input type="number" id="subItemAmount" step="0.01">
                </div>
                <button onclick="budgetManager.addSubItem()" class="submit-btn">הוסף תת-פריט</button>
            </div>

            <div class="form-actions">
                <button onclick="budgetManager.saveSubItems()" class="submit-btn">שמור וסגור</button>
                <button onclick="budgetManager.closeSubItemsModal()" class="cancel-btn">ביטול</button>
            </div>
        </div>
    </div>

    <!-- Modal לעדכון סכום משתנה -->
    <div id="amountModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="budgetManager.closeAmountModal()">&times;</span>
            <h3 id="amountModalTitle">עדכן סכום לחודש</h3>

            <div class="form-group">
                <label id="amountModalLabel"></label>
                <input type="number" id="monthlyAmount" step="0.01">
            </div>

            <div class="form-actions">
                <button onclick="budgetManager.saveMonthlyAmount()" class="submit-btn">שמור</button>
                <button onclick="budgetManager.closeAmountModal()" class="cancel-btn">ביטול</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
