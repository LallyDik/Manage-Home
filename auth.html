<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>התחברות - ניהול הכנסות והוצאות</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>💰 ניהול הכנסות והוצאות</h1>

            <!-- טאבים להתחברות/הרשמה -->
            <div class="tabs">
                <button class="tab active" data-tab="login">התחברות</button>
                <button class="tab" data-tab="signup">הרשמה</button>
            </div>

            <!-- הודעת שגיאה/הצלחה -->
            <div id="message" class="message"></div>

            <!-- טופס התחברות -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">אימייל:</label>
                    <input type="email" id="loginEmail" required placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label for="loginPassword">סיסמה:</label>
                    <input type="password" id="loginPassword" required placeholder="הזן סיסמה">
                </div>

                <button type="submit" class="submit-btn">התחבר</button>

                <div class="divider">
                    <span>או</span>
                </div>

                <button type="button" id="googleSignInBtn" class="google-btn">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        <path fill="none" d="M0 0h48v48H0z"/>
                    </svg>
                    התחבר עם Google
                </button>
            </form>

            <!-- טופס הרשמה -->
            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label for="signupEmail">אימייל:</label>
                    <input type="email" id="signupEmail" required placeholder="example@email.com">
                </div>

                <div class="form-group">
                    <label for="signupPassword">סיסמה:</label>
                    <input type="password" id="signupPassword" required placeholder="לפחות 6 תווים">
                </div>

                <div class="form-group">
                    <label for="signupPasswordConfirm">אימות סיסמה:</label>
                    <input type="password" id="signupPasswordConfirm" required placeholder="הזן סיסמה שוב">
                </div>

                <button type="submit" class="submit-btn">הירשם</button>

                <div class="divider">
                    <span>או</span>
                </div>

                <button type="button" id="googleSignUpBtn" class="google-btn">
                    <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        <path fill="none" d="M0 0h48v48H0z"/>
                    </svg>
                    הירשם עם Google
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>

    <script>
        // ניהול טאבים
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const tabName = tab.dataset.tab;

                // עדכן טאבים פעילים
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // הצג את הטופס המתאים
                document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
                document.getElementById(tabName === 'login' ? 'loginForm' : 'signupForm').classList.add('active');

                // נקה הודעות
                clearMessage();
            });
        });

        // הצג הודעה
        function showMessage(text, isError = false) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.className = `message ${isError ? 'error' : 'success'} show`;
        }

        // נקה הודעה
        function clearMessage() {
            const messageEl = document.getElementById('message');
            messageEl.className = 'message';
        }

        // טיפול בטופס התחברות
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessage();

            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const result = await FirebaseAuth.signIn(email, password);

            if (result.success) {
                showMessage('התחברת בהצלחה! מעביר לאפליקציה...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showMessage(result.error, true);
            }
        });

        // טיפול בטופס הרשמה
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessage();

            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const passwordConfirm = document.getElementById('signupPasswordConfirm').value;

            // בדוק התאמת סיסמאות
            if (password !== passwordConfirm) {
                showMessage('הסיסמאות אינן תואמות', true);
                return;
            }

            const result = await FirebaseAuth.signUp(email, password);

            if (result.success) {
                showMessage('נרשמת בהצלחה! מעביר לאפליקציה...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showMessage(result.error, true);
            }
        });

        // התחברות עם Google - מטופס התחברות
        document.getElementById('googleSignInBtn').addEventListener('click', async () => {
            clearMessage();
            const result = await FirebaseAuth.signInWithGoogle();

            if (result.success) {
                showMessage('התחברת בהצלחה! מעביר לאפליקציה...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showMessage(result.error, true);
            }
        });

        // התחברות עם Google - מטופס הרשמה
        document.getElementById('googleSignUpBtn').addEventListener('click', async () => {
            clearMessage();
            const result = await FirebaseAuth.signInWithGoogle();

            if (result.success) {
                showMessage('נרשמת בהצלחה! מעביר לאפליקציה...');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
            } else {
                showMessage(result.error, true);
            }
        });

        // בדוק אם המשתמש כבר מחובר
        FirebaseAuth.onAuthStateChanged((user) => {
            if (user) {
                // המשתמש מחובר, העבר לאפליקציה
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
